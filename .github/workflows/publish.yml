name: Publish Crates + Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install greentic tools
        run: |
          cargo install cargo-binstall
          cargo binstall gtc -y
          gtc install

      - name: Show workspace version
        id: version
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="dwbase-core") | .version' | head -n1)
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Workspace version: ${ver}"

      - name: Publish crates (ignore already uploaded)
        env:
          CARGO_REGISTRIES_CRATES_IO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          rustup target add wasm32-wasip2
          chmod +x ci/publish-crates.sh
          ./ci/publish-crates.sh || true

      - name: Create/Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: "Automated release for version v${{ steps.version.outputs.version }} (crates.io publish)."
          allowUpdates: true
          makeLatest: true

  cli-binaries:
    name: Build CLI binaries (${{ matrix.target }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            bin: dwbase
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            bin: dwbase
            linker: aarch64-linux-gnu-gcc
          - os: macos-15
            target: x86_64-apple-darwin
            archive: tar.gz
            bin: dwbase
          - os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
            bin: dwbase
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            bin: dwbase.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
            bin: dwbase.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build CLI
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --release -p dwbase-cli --target ${{ matrix.target }}

      - name: Package artifact (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          mkdir -p dist
          tar -C "target/${TARGET}/release" -czf "dist/dwbase-cli-${VERSION}-${TARGET}.tar.gz" "${BIN_NAME}"

      - name: Package artifact (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          BIN_NAME: ${{ matrix.bin }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/$Env:TARGET/release/$Env:BIN_NAME"
          Compress-Archive -Path $src -DestinationPath "dist/dwbase-cli-$Env:VERSION-$Env:TARGET.zip" -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          files: |
            dist/dwbase-cli-*-${{ matrix.target }}.${{ matrix.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
