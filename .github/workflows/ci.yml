name: CI
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Install greentic tools
        run: |
          cargo install cargo-binstall
          cargo binstall greentic-component -y
          cargo binstall packc -y
          cargo binstall cargo-component -y

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --exclude component-dwbase --exclude dwbase-pack-runner -- -D warnings

      - name: Tests
        run: cargo test --workspace --exclude component-dwbase --exclude dwbase-pack-runner

      - name: Install wasm32-wasip2 target
        run: rustup target add wasm32-wasip2

      - name: Build component (wasm32-wasip2)
        run: |
          COMPONENT_MANIFEST="$GITHUB_WORKSPACE/crates/component-dwbase/component.manifest.json"
          greentic-component build --manifest "$COMPONENT_MANIFEST"
          COMPONENT_WASM="$GITHUB_WORKSPACE/crates/component-dwbase/target/wasm32-wasip2/release/component_dwbase.wasm"
          greentic-component hash --wasm "$COMPONENT_WASM" "$COMPONENT_MANIFEST"
          mkdir -p packs/dwbase-gtpack/components
          cp "$COMPONENT_WASM" packs/dwbase-gtpack/components/component_dwbase.wasm
          cp "$COMPONENT_MANIFEST" packs/dwbase-gtpack/components/component.manifest.json

      - name: Build dwbase gtpack
        run: packc build --in packs/dwbase-gtpack --gtpack-out packs/dwbase-gtpack/dist/dwbase.gtpack

      - name: Component doctor
        run: greentic-component doctor crates/component-dwbase/target/wasm32-wasip2/release/component_dwbase.wasm --manifest crates/component-dwbase/component.manifest.json

      - name: Pack verify
        run: |
          MANIFEST="$GITHUB_WORKSPACE/packs/dwbase-gtpack/dist/manifest.cbor"
          if [ -f "$MANIFEST" ]; then
            DEV_KEY="$GITHUB_WORKSPACE/packs/dwbase-gtpack/dist/dev-component.key"
            DEV_PUB="$GITHUB_WORKSPACE/packs/dwbase-gtpack/dist/dev-component.pub"
            openssl genpkey -algorithm Ed25519 -out "$DEV_KEY"
            openssl pkey -in "$DEV_KEY" -pubout -out "$DEV_PUB"
            packc sign --pack "$GITHUB_WORKSPACE/packs/dwbase-gtpack" --manifest "$MANIFEST" --key "$DEV_KEY" --offline
            packc verify --pack "$GITHUB_WORKSPACE/packs/dwbase-gtpack" --manifest "$MANIFEST" --key "$DEV_PUB" --offline
          else
            echo "pack manifest not found, skipping packc verify"
          fi

      - name: Schema/manifest sync check
        run: python3 tools/check_schema_sync.py
