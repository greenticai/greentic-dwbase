[workspace]
members = [
    "crates/*",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0-dev.0"
authors = [
    "Greentic AI",
]
description = "DWBase: agent-first immutable atom store, components, and tools."
homepage = "https://github.com/greenticai/greentic-dwbase"
documentation = "https://github.com/greenticai/greentic-dwbase"
repository = "https://github.com/greenticai/greentic-dwbase"
readme = "README.md"
keywords = [
    "agents",
    "memory",
    "vector",
    "wasm",
    "database",
]
categories = [
    "database-implementations",
    "wasm",
    "command-line-utilities",
]

[workspace.dependencies]
serde_json = "1"
thiserror = "2"
hnsw_rs = "0.3"
rand = "0.10"
num_cpus = "1"
wit-parser = "0.246"
tracing = "0.1"
tracing-subscriber = "0.3"
metrics = "0.24"
anyhow = "1"
clap = "4"
reqwest = "0.13"
axum = "0.8"
toml = "1"
fs2 = "0.4"
uuid = "1"
ctrlc = "3"
zstd = "0.13"
tar = "0.4"
humantime = "2"
walkdir = "2"
async-trait = "0.1"
futures = "0.3"
parking_lot = "0.12"
once_cell = "1"
hex = "0.4"
crc32fast = "1"
sha2 = "0.11"
aes-gcm = "0.10"
rand_chacha = "0.10"
indexmap = "2"
sled = "0.34"
wit-bindgen = "0.55"
siphasher = "1"
tempfile = "3"

[workspace.dependencies.serde]
version = "1"
features = [
    "derive",
]

[workspace.dependencies.rmp-serde]
version = "1"
default-features = false

[workspace.dependencies.time]
version = "0.3"
default-features = false
features = [
    "formatting",
    "parsing",
]

[workspace.dependencies.metrics-exporter-prometheus]
version = "0.18"
default-features = false

[workspace.dependencies.criterion]
version = "0.8"
features = [
    "async_tokio",
]

[workspace.dependencies.async-nats]
version = "0.47"
default-features = false
features = [
    "ring",
]

[workspace.dependencies.tokio]
version = "1"
default-features = false

[workspace.dependencies.dwbase-core]
path = "crates/dwbase-core"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-engine]
path = "crates/dwbase-engine"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-metrics]
path = "crates/dwbase-metrics"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-storage-sled]
path = "crates/dwbase-storage-sled"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-vector-hnsw]
path = "crates/dwbase-vector-hnsw"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-stream-local]
path = "crates/dwbase-stream-local"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-security]
path = "crates/dwbase-security"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-embedder-dummy]
path = "crates/dwbase-embedder-dummy"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-swarm]
path = "crates/dwbase-swarm"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-swarm-nats]
path = "crates/dwbase-swarm-nats"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-cli]
path = "crates/dwbase-cli"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-node]
path = "crates/dwbase-node"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-wit-host]
path = "crates/dwbase-wit-host"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-wit-guest]
path = "crates/dwbase-wit-guest"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-bench]
path = "crates/dwbase-bench"
version = "0.2.0-dev.0"

[workspace.dependencies.component-dwbase]
path = "crates/component-dwbase"
version = "0.2.0-dev.0"

[workspace.dependencies.dwbase-pack-runner]
path = "crates/dwbase-pack-runner"
version = "0.2.0-dev.0"
